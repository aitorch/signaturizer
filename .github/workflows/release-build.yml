name: Build Release Artifacts

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: |
              out/**/*.deb
              out/**/*.zip
              out/**/*.AppImage
          - os: macos-latest
            platform: darwin
            artifact_pattern: |
              out/**/*.zip
              out/**/*.dmg
          - os: windows-latest
            platform: win32
            artifact_pattern: |
              out/**/*.zip
              out/**/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build packages (${{ matrix.platform }})
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_pattern }}
